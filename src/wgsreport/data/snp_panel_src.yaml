# Curated single-SNP panel. Coordinates are resolved from Ensembl (GRCh38) by
# scripts/resolve_snp_panel.py into snp_panel.tsv; this file holds only the biology.
#
# effect: the allele (forward strand, GRCh38) that the notes describe, or "alt" meaning "the
#         non-reference allele" (used for rare variants where REF is the normal allele).
# notes:  text for 0 / 1 / 2 copies of the effect allele.
# These are population-level associations, not diagnoses. Absence of a variant from a WGS VCF is
# interpreted as homozygous reference; X-linked entries use the sample's X genotype as called.
#
# category: trait | nutrition | health | pgx (pharmacogenomics, CPIC-style) | sensitive (opt-in)

snps:
