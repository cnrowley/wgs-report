# Trait registry: which polygenic scores (PGS Catalog, https://www.pgscatalog.org) are used,
# and the published evidence that justifies reporting them.
#
# INCLUSION RULES (applied by hand when curating this file; see docs/METHODS.md)
#   1. The trait is highly heritable (twin/family h2 >= ~0.4).
#   2. A published PGS predicts it well in held-out European-ancestry samples:
#        quantitative traits: variance explained (R2 = r^2) >= 0.09  (tier A >= 0.20, tier B 0.09-0.20; tiers rank published predictive strength only, not replication or evidence quality)
#        binary traits:       OR per SD >= ~1.6 (AUROC and liability-scale R2 are reported as context, not hard cut-offs:
#                             both depend on prevalence and cohort)
#   3. The score is available as GRCh38-harmonized weights for (almost) all of its variants.
#   4. The trait is meaningful to a person reading their own report.
#   Tier C = fails rule 2 but is reported because the user explicitly asked for it; read with caution.
#
# FIELDS
#   id            short key
#   label         display name
#   pgs           PGS Catalog score id (primary score)
#   kind          quantitative | binary
#   h2_twin       twin/family heritability (rounded literature value; see references)
#   r2            held-out R2 of the score alone, European ancestry (quantitative traits)
#   r2_source     where r2 came from
#   or_per_sd     odds/hazard ratio per 1 SD of the score (binary traits)
#   auroc         AUROC range reported (binary traits)
#   metric_note   free text on the evidence
#   unit/mean/sd  optional absolute phenotype scale used to translate the score into units
#   sex           restrict to a sex ("male"/"female"); omitted = both
#   tier          A | B | C
#   cite          citation for the score
#   crosscheck    second genome-wide score, standardised against the reference panel like the primary one
#   variant_set   optional PGS Catalog id of a SHORT explicit-weight score (<~500 variants, weights in the trait's units). It is not
#                 standardised; the carried variants and their summed weight are reported (see variant_scores.py)
#   r2_by_ancestry   held-out R2 of the same score outside Europeans, keyed by 1000G super-population (SAS EAS AFR AMR); used by
#                 registry.for_ancestry to recompute accuracy and tier when the user is not European
#   alt_scores    {group: {pgs, r2, source}}: a different score that is better in that group; used only if its R2 beats the default's there
#   variant_set_primary / variant_set_threshold   headline from the variant set instead of the percentile; threshold = guideline cut-off in the same unit
#   variant_set_unit   unit of those weights
#   related_rsids / related_not_in_score   well-known large-effect SNPs; flag that the primary score cannot see them
#   related_text {rsid: wording} replaces the SNP panel note when the SNP's meaning for this trait differs from its panel note
#   related_effect {rsid: up|down}   direction of each related variant's effect on the trait (the override fires only when the score reads against it)

traits:
  - id: height
    label: Adult height
    pgs: PGS002804
    kind: quantitative
    h2_twin: 0.80
    r2: 0.40
    r2_source: "Yengo et al. 2022 (independent European-ancestry validation; R2 ~0.40)"
    unit: cm
    mean: {male: 178.0, female: 164.5}
    sd: {male: 7.0, female: 6.5}
    tier: A
    cite: "Yengo L et al. Nature 2022, doi:10.1038/s41586-022-05275-y"
    crosscheck: PGS002146     # Prive 2022 LDpred2 height score (partial r 0.61 => R2 ~0.38 in UKB hold-out)

  - id: bmi
    label: Body-mass index
    pgs: PGS002161
    kind: quantitative
    h2_twin: 0.75
    r2: 0.134
    r2_source: "Prive et al. 2022, UK Biobank European hold-out, partial r = 0.366"
    unit: "kg/m2"
    mean: {male: 27.5, female: 27.0}
    sd: {male: 4.5, female: 5.5}
    tier: B
    cite: "Prive F et al. AJHG 2022, doi:10.1016/j.ajhg.2021.11.008"

  - id: lpa
    label: Lipoprotein(a)
    related_rsids: [rs10455872, rs3798220]
    # Checked against PGS002181: rs10455872 is not among its variants and rs3798220 has weight 0, so the score cannot see the two best-known
    # Lp(a)-raising SNPs (Prive's scores use HapMap3-based variants). The report therefore overrides the score's reading when either is carried.
    related_not_in_score: true
    # Explicit-weight cross-check (variant_scores.py): 43 conditionally independent LPA-region variants, weights in nmol/L, derived in
    # Danish cohorts and evaluated in UK Biobank Europeans (R2 0.60, n=351k; R2 0.04-0.11 in African, East and South Asian samples).
    variant_set: PGS000667
    variant_set_unit: "nmol/L"
    variant_set_primary: true     # a few large-effect variants decide this trait: the explicit-variant total is the headline, the genome-wide percentile is background
    variant_set_threshold: 125    # nmol/L (about 50 mg/dL): the risk-enhancing Lp(a) level in the 2018 AHA/ACC cholesterol guideline
    pgs: PGS002181
    kind: quantitative
    h2_twin: 0.90
    r2: 0.336
    r2_source: "Prive et al. 2022, UK Biobank European hold-out, partial r = 0.580"
    metric_note: "Dominated by the LPA locus; the KIV-2 copy-number repeat is not captured by SNP scores."
    tier: A
    # Held-out R2 outside Europeans (UK Biobank; PGS Catalog performance metrics, partial r squared). registry.for_ancestry uses these:
    # PGS000689 (snpnet, Sinnott-Armstrong 2021) beats the default in South and East Asians.
    r2_by_ancestry: {SAS: 0.087, EAS: 0.021, AFR: 0.0}
    alt_scores:
      SAS: {pgs: PGS000689, r2: 0.167, source: "Sinnott-Armstrong 2021, UK Biobank South Asian, n=6453, R2 0.167 (PGS Catalog)"}
      EAS: {pgs: PGS000689, r2: 0.062, source: "Sinnott-Armstrong 2021, UK Biobank East Asian, n=980, R2 0.062 (PGS Catalog)"}
    cite: "Prive F et al. AJHG 2022, doi:10.1016/j.ajhg.2021.11.008"

  - id: apoa1
    label: Apolipoprotein A-I
    category: blood
    pgs: PGS001888
    kind: quantitative
    h2_twin: 0.55          # approximate: twin/family estimates for apoA-I are roughly 0.4-0.7
    r2: 0.168
    r2_source: "Prive et al. 2022, UK Biobank European hold-out (n=17,339), partial r = 0.410"
    r2_by_ancestry: {SAS: 0.132, EAS: 0.122, AFR: 0.049}
    metric_note: "Main protein of HDL; correlates with HDL-C but is a separate measurement."
    tier: B
    cite: "Prive F et al. AJHG 2022, doi:10.1016/j.ajhg.2021.11.008"

