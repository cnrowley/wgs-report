# Candidates screened and NOT reported (shown in the report's screening appendix).
excluded:
  - {label: "Intelligence, cognitive performance and educational attainment", reason: "Excluded by maintainer decision, not because there is no signal: published scores explain roughly 5-16% of variance at the population level (educational attainment 12-16%, cognitive performance about 5-10%). The reasons are: for educational attainment the within-family (direct) effect is about half the population estimate (cognitive performance attenuates less, about 0.88 in one 2025 study), individual-level utility is poor, results differ across scores (locally built scores for the same person differed by tens of percentile points), and they are easily misused. Not implemented."}
  - {label: "Schizophrenia", reason: "Included (on by default once built locally; `--exclude psychiatric` omits it): PGC3 scores reach AUROC ~0.72 / liability R2 ~0.07 (paper text). Reported as a locally-built score (PGC3 summary statistics cannot be shipped as weights). Do not use PGS002785 as a benchmark: it was evaluated on childhood behaviour, not case-control status."}
  - {label: "Depression / neuroticism / happiness", reason: "PGS partial correlation <= 0.2 and h2 mostly environmental in twin data"}
  - {label: "Systolic / diastolic blood pressure", reason: "PGS R2 ~0.06-0.07, below the R2 >= 0.09 cut-off"}
  - {label: "Hair colour, skin colour, tanning", reason: "Good prediction, but UKB ordinal coding direction is ambiguous in PGS metadata; individual pigmentation SNPs (HERC2, MC1R, SLC45A2) are reported in the SNP panel instead"}
  - {label: "Male-pattern baldness", reason: "Ordinal coding direction ambiguous in PGS metadata; reported via a lead-SNP panel only if available"}
  - {label: "Glucose, urea, calcium, ALT/AST, albumin, vitamin D, testosterone", reason: "Held-out partial r 0.15-0.29 (R2 < 0.09), below the cut-off"}
  - {label: "Most other common diseases (asthma, depression, cancers other than prostate, ...)", reason: "Partial correlations of the best scores are < 0.15"}
