[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wgs-report"
version = "0.1.0"
description = "Polygenic-score and SNP report from a personal whole-genome VCF (GRCh38)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
wgsreport = "wgsreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wgsreport = ["data/*"]

[tool.pytest.ini_options]
markers = ["network: contacts upstream servers (run with -m network)"]
addopts = "-m 'not network'"
